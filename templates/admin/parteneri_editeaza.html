{% extends "base.html" %}
{% block titlu %}Editează partener{% endblock %}
{% block continut %}
<div class="container hero" style="padding-block:40px 20px;">
  <h1 style="font-size:1.7rem;">Editează partener</h1>
  <p class="lede"><a href="{{ url_for('admin_parteneri') }}">&larr; Înapoi la lista de parteneri</a></p>
</div>

<div class="container" style="padding-bottom:60px;max-width:640px;">
  {% if partener['logo_path'] %}
  <div class="partener-logo" style="width:140px;height:140px;margin-bottom:14px;">
    <img src="{{ url_for('static', filename=partener['logo_path']) }}" alt="">
  </div>
  {% endif %}
  <form class="form" method="post" enctype="multipart/form-data">
    <div class="camp">
      <label for="nume">Nume firmă / instituție</label>
      <input type="text" id="nume" name="nume" value="{{ partener['nume'] }}" required>
    </div>
    <div class="camp">
      <label for="cif">CIF</label>
      <input type="text" id="cif" name="cif" value="{{ partener['cif'] }}" required>
    </div>
    <div class="camp">
      <label for="website">Website (opțional)</label>
      <input type="url" id="website" name="website" value="{{ partener['website'] or '' }}" placeholder="https://...">
    </div>
    <div class="camp">
      <label for="descriere">Descriere scurtă a sprijinului (opțional)</label>
      <textarea id="descriere" name="descriere" rows="2">{{ partener['descriere'] or '' }}</textarea>
    </div>
    <div class="camp">
      <label for="logo">Înlocuiește logo-ul (opțional)</label>
      <input type="file" id="logo" name="logo" accept="image/*">
      <p class="cap" style="margin:0;">Lasă necompletat ca să păstrezi logo-ul actual.</p>
    </div>
    <div class="camp">
      <label for="ordine">Ordine afișare</label>
      <input type="number" id="ordine" name="ordine" value="{{ partener['ordine'] }}">
    </div>
    <div class="camp camp-checkbox">
      <label class="checkbox">
        <input type="checkbox" name="activ" {% if partener['activ'] %}checked{% endif %}>
        <span>Afișat pe pagina publică de Parteneri</span>
      </label>
    </div>
    <button class="btn" type="submit" style="align-self:flex-start;">Salvează</button>
  </form>
</div>
{% endblock %}
